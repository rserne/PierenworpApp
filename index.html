<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#110d15" media="(prefers-color-scheme: dark)">
<meta name="description" content="Dobbelspel: gooi acht stenen en verzamel tegels met pieren.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico?v=18" sizes="48x48">
<link rel="icon" href="favicon-32.png?v=18" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png?v=18" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=18" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pierenworp">
<title>Pierenworp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: mobiele app — compacte kop met pictogramknoppen, tegelrooster, spelerskaarten, worpkaart met voortgangsbalk naar 21, en een vaste actiebalk onderin binnen duimbereik. Volgt licht/donker van het toestel. */
:root{
  --bg:#f4f1f6; --surface:#ffffff; --surface-2:#ebe6ef; --line:rgba(29,22,38,.10);
  --ink:#1d1626; --muted:#6c6276;
  --pink:#f2457d; --pink-ink:#ffffff; --pink-soft:#ffe0ea;
  --mint:#12b98d; --mint-ink:#ffffff; --mint-soft:#d6f5ea;
  --bad:#e5484d; --bad-ink:#ffffff; --bad-soft:#ffe6e6;
  --die:#ffffff; --pip:#1d1626; --tile:#ffffff;
  --shadow:0 1px 2px rgba(29,22,38,.06),0 6px 20px rgba(29,22,38,.07);
  --shadow-lift:0 2px 4px rgba(29,22,38,.08),0 14px 30px rgba(29,22,38,.14);
  --dock:rgba(244,241,246,.82);
  --p1:#e23d73; --p2:#6a4cf0; --p3:#0f9a77; --p4:#cf7a12; --p5:#1c82d0; --p6:#d6512a;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#110d15; --surface:#1c1722; --surface-2:#29222f; --line:rgba(255,255,255,.08);
  --ink:#f3eef7; --muted:#a297ac;
  --pink:#ff5f93; --pink-ink:#1d0b13; --pink-soft:rgba(255,95,147,.16);
  --mint:#34dcab; --mint-ink:#04201a; --mint-soft:rgba(52,220,171,.15);
  --bad:#ff5f66; --bad-ink:#1c0607; --bad-soft:rgba(255,95,102,.16);
  --die:#f8f4fb; --pip:#1d1626; --tile:#241e2a;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 1px 0 rgba(255,255,255,.06) inset,0 16px 34px rgba(0,0,0,.55);
  --dock:rgba(17,13,21,.82);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#110d15; --surface:#1c1722; --surface-2:#29222f; --line:rgba(255,255,255,.08);
  --ink:#f3eef7; --muted:#a297ac;
  --pink:#ff5f93; --pink-ink:#1d0b13; --pink-soft:rgba(255,95,147,.16);
  --mint:#34dcab; --mint-ink:#04201a; --mint-soft:rgba(52,220,171,.15);
  --bad:#ff5f66; --bad-ink:#1c0607; --bad-soft:rgba(255,95,102,.16);
  --die:#f8f4fb; --pip:#1d1626; --tile:#241e2a;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 1px 0 rgba(255,255,255,.06) inset,0 16px 34px rgba(0,0,0,.55);
  --dock:rgba(17,13,21,.82);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(230px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}

/* kop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em}
.logo .mark{width:38px;height:38px;flex:none;border-radius:11px;box-shadow:var(--shadow)}
.icons{display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.ib svg{width:20px;height:20px}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

/* tegelrooster */
.grill{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.tile{position:relative;aspect-ratio:3/5;border-radius:11px;background:var(--tile);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;padding:7px 0;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s,background .25s}
.tile .num{flex:none;font-family:var(--f-display);font-weight:600;font-size:clamp(12px,3.6vw,17px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.tile .worms{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;width:46%;margin-top:6px}
.tile .worms svg{width:100%;height:auto;display:block}
.tile.flipped{background:var(--surface-2);box-shadow:none}
.tile.flipped::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 8px)}
.tile.flipped>*,.tile.taken>*{visibility:hidden}
.tile.taken{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.tile.is-target{transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 2.5px var(--mint),var(--shadow-lift)}

/* spelers */
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px;display:flex;align-items:center;gap:10px;min-width:0;transition:box-shadow .2s}
.pcard.is-cur{box-shadow:0 0 0 2px var(--pink),var(--shadow)}
.pcard.is-victim{box-shadow:0 0 0 2px var(--mint),var(--shadow-lift)}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;background:var(--c)}
.pcard .who{flex:1;min-width:0}
.pcard .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.pcard .meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px;white-space:nowrap;margin-top:2px}
.pcard .stat{display:inline-flex;align-items:center;gap:5px}
.pcard .stat svg.wi{width:16px;height:6px}
.pcard .stat svg.ti{width:10px;height:14px}
.pcard .stat b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px}
.pcard.got .mini{animation:pop .5s cubic-bezier(.2,.9,.3,1.5) both}
.mini{width:30px;height:48px;flex:none;border-radius:7px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;padding:4px 0}
.mini .num{flex:none;font-family:var(--f-display);font-weight:600;font-size:10.5px;line-height:1;letter-spacing:-.03em}
.mini .worms{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1px;width:50%;margin-top:3px}
.mini .worms svg{width:100%;height:auto;display:block}
.mini.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}

/* worpkaart */
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:16px}
.status{margin:0;font-size:16px;font-weight:500;min-height:1.45em;text-wrap:balance}
.status b{font-weight:700;color:var(--pink)}
.score-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.tot{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tot small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.chip svg{width:20px;height:8px}
.chip.ok{background:var(--pink-soft);color:var(--pink)}
.meter{position:relative;height:8px;border-radius:99px;background:var(--surface-2);overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--pink);transition:width .45s cubic-bezier(.2,.9,.3,1)}
.meter .fill.ok{background:var(--mint)}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--ink);opacity:.5}
.meter-legend{position:relative;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.meter-legend span:nth-child(2){position:absolute;top:0;transform:translateX(-50%);font-weight:700;color:var(--ink)}
.meter-wrap{position:relative}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;align-items:center}
.empty-tray{color:var(--muted);font-size:14px}
.die{width:56px;height:56px;padding:0;border:0;background:none;border-radius:14px;flex:none;transition:transform .18s cubic-bezier(.2,.9,.3,1.4),opacity .15s}
.die svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 8px rgba(29,22,38,.18))}
.die.sm{width:30px;height:30px}
.die.sm svg{filter:drop-shadow(0 1px 2px rgba(29,22,38,.18))}
.rolled{display:flex;flex-wrap:wrap;gap:12px;min-height:56px;padding-top:6px}
.rolled .die:disabled{cursor:default}
.rolled .die.used{opacity:.28}
.rolled.choosing .die:not(.chosen){opacity:.3}
.rolled .die.chosen{transform:translateY(-6px);box-shadow:0 0 0 2.5px var(--mint)}
.die.sm.new{animation:pop .45s cubic-bezier(.2,.9,.3,1.5) both;animation-delay:calc(var(--i)*60ms)}
@keyframes pop{from{transform:translateY(-18px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.inline-die{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin:0 2px}
.inline-die svg{width:100%;height:100%;display:block}
.rolled.can .die:not(:disabled):hover,.rolled.can .die.hi{transform:translateY(-6px) scale(1.04)}
.rolled.fresh .die{animation:tumble .5s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i)*45ms)}
@keyframes tumble{from{transform:translate(-28px,-16px) rotate(-210deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.divider{height:1px;background:var(--line);margin:0}

/* actiebalk */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--dock);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dock-in p{margin:0;flex:1 1 100%;font-weight:600;font-size:15px}
.dock-in .dock-msg{font-weight:500;font-size:15.5px;line-height:1.35;text-wrap:balance}
.dock-msg b{font-weight:700;color:var(--pink)}
.wait .dock-msg{flex:1;color:var(--ink)}

/* uitslag van een beurt */
.result{flex:1 1 100%;display:flex;align-items:center;gap:14px;border-radius:18px;padding:12px 14px;animation:rise .4s cubic-bezier(.2,.9,.3,1.25) both}
.result .r-text{flex:1;min-width:0}
.result .r-title{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;line-height:1.15;margin:0}
.result .r-sub{margin:3px 0 0;font-size:14px;font-weight:500;line-height:1.35}
.result.take{background:var(--mint-soft)}
.result.take .r-title{color:var(--mint)}
.result.steal{background:var(--pink-soft)}
.result.steal .r-title{color:var(--pink)}
.result.bust{background:var(--bad);color:var(--bad-ink)}
.result.bust .r-sub{opacity:.92}
.result .bigtile{width:44px;height:68px;flex:none;border-radius:10px;background:var(--tile);box-shadow:var(--shadow-lift);display:flex;flex-direction:column;align-items:center;padding:6px 0}
.result .bigtile .num{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.result .bigtile .worms{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2px;width:50%;margin-top:5px}
.result .bigtile .worms svg{width:100%;height:auto;display:block}
.result .bust-icon{width:44px;height:44px;flex:none;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.result .bust-icon svg{width:24px;height:24px}
@keyframes rise{from{transform:translateY(16px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.btn{flex:1 1 140px;min-height:54px;border:0;border-radius:16px;padding:0 18px;font-weight:700;font-size:16.5px;background:var(--pink);color:var(--pink-ink);box-shadow:0 6px 16px -6px var(--pink);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.05)}
.btn.go{background:var(--mint);color:var(--mint-ink);box-shadow:0 6px 16px -6px var(--mint)}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wait{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);min-height:54px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:blink 1s infinite both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}

/* setup */
.hero{display:flex;flex-direction:column;gap:10px}
.hero h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,7vw,36px);line-height:1.05;letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--pink)}
.lede{margin:0;font-size:16px;color:var(--muted);max-width:44ch;text-wrap:pretty}
.seats{display:flex;flex-direction:column;gap:8px}
.seat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:8px 8px 8px 10px}
.seat input{flex:1 1 56px;min-width:0;background:transparent;border:0;padding:8px 2px;font:inherit;font-weight:600;color:var(--ink)}
.seat.off{box-shadow:none;background:transparent;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.seat.off input,.seat.off .avatar{opacity:.4}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(29,22,38,.15)}
.err{color:var(--pink);font-weight:600;margin:0}

/* regels */
details.rules{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:2px 18px}
details.rules summary{font-weight:700;padding:14px 0;cursor:pointer}
details.rules ol{margin:0 0 16px;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:62ch;color:var(--muted)}
details.rules p{margin:0 0 12px;color:var(--muted);max-width:62ch}
.rules-grill{margin:0 0 18px}
.rules-grill .tile{box-shadow:inset 0 0 0 1.5px var(--line);background:var(--bg)}
.tiers{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;font-size:13px}
.tiers span{background:var(--surface-2);border-radius:8px;padding:4px 9px;font-variant-numeric:tabular-nums;font-weight:500}

/* einde */
.podium{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:64px 1fr;align-items:start;column-gap:16px;row-gap:10px;background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:16px 18px}
.prow .score{grid-row:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;align-self:stretch;border-radius:14px;background:var(--surface-2);padding:10px 0}
.prow .score b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.prow .score span{font-size:12px;color:var(--muted);margin-top:4px}
.prow .who{min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prow .name{font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:6px}
.prow .name svg{width:20px;height:20px;color:var(--pink)}
.prow .meta{font-size:13px;color:var(--muted)}
.prow .ptiles{display:flex;flex-wrap:wrap;gap:5px}
.prow .ptiles .mini{background:var(--surface-2)}
.prow.win{background:var(--pink-soft);box-shadow:none}
.prow.win .score{background:var(--pink);color:var(--pink-ink)}
.prow.win .score span{color:var(--pink-ink);opacity:.85}
.prow.win .ptiles .mini{background:var(--surface)}
.prow .no-tiles{font-size:13px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:0}

/* updatemelding */
.update{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:20;width:min(528px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-lift);font-weight:600;font-size:14.5px;animation:drop .4s cubic-bezier(.2,.9,.3,1.2) both}
.update span{flex:1;min-width:0}
.up-btn{flex:none;border:0;border-radius:11px;padding:10px 15px;font-weight:700;font-size:14.5px;background:var(--pink);color:var(--pink-ink)}
@keyframes drop{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
/* in Safari (niet als app op het beginscherm) ligt de onderbalk van de browser over de onderkant: houd de knoppen daar vandaan */
@media not all and (display-mode: standalone){
  .dock{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-block-end:calc(250px + env(safe-area-inset-bottom,0px))}
}
/* online spelen */
.btn.ping{animation:ping 1.1s ease-out 3}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--pink)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn.autonext{background-image:linear-gradient(90deg,rgba(255,255,255,.22) 50%,transparent 50%);background-size:200% 100%;background-position:100% 0;animation:fillbar var(--auto) linear forwards}
@keyframes fillbar{to{background-position:0 0}}

.choice{background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:14px}
.choice.invited{box-shadow:0 0 0 2px var(--pink),var(--shadow-lift)}
.choice-head{display:flex;gap:14px;align-items:flex-start}
.choice-head h3{margin:2px 0 3px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.choice-head p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.4}
.choice-icon{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center}
.choice-icon svg{width:22px;height:22px}
.choice-icon.start{background:var(--mint-soft);color:var(--mint)}
.choice-icon.join{background:var(--pink-soft);color:var(--pink)}
.choice .btn{flex:none}
.choice .join-row .btn{flex:0 0 auto;min-height:0;padding:0 20px}
.choice .field{background:var(--surface-2);box-shadow:none}
.dock[hidden]{display:none!important}

.modes{display:flex;width:100%}
.modes button{flex:1;padding:11px 10px;font-size:15px}
.online{display:flex;flex-direction:column;gap:16px}
.fieldset{display:flex;flex-direction:column}
.field{width:100%;min-width:0;background:var(--surface);box-shadow:var(--shadow);border:0;border-radius:14px;padding:13px 14px;font:inherit;font-weight:600;color:var(--ink)}
.field::placeholder{color:var(--muted);font-weight:500}
.field.code{text-transform:uppercase;letter-spacing:.35em;font-family:var(--f-display);font-size:20px;text-align:center;padding:10px 14px}

<body>

<div class="wrap" id="app"></div>
<div class="dock" id="dock"></div>
<div class="update" id="update" role="status" aria-live="polite" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
const KEY='pierenworp-v1';
const AI_NAMES=['Pip','Mo','Bo','Lies','Teun'];
const val=f=>f===6?5:f;
const wormsOf=n=>n<=24?1:n<=28?2:n<=32?3:4;
const wl=n=>n===1?'1 pier':n+' pieren';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S=null;
let seats=[
  {name:'Jij',type:'mens'},{name:'Pip',type:'computer'},{name:'Mo',type:'computer'},
  {name:'Bo',type:'uit'},{name:'Lies',type:'uit'},{name:'Teun',type:'uit'}
];
let pref={fast:false,sound:true};
const soundOn=()=>pref.sound!==false;
const ui={confirm:false,fresh:false,err:'',update:null,newKept:0,mode:'local',netBusy:'',netErr:'',netMsg:'',joinCode:''};

/* ---------- melding bij een nieuwe versie (aangeroepen door de app-schil) ---------- */
function renderUpdate(busy){
  const el=document.getElementById('update'); if(!el) return;
  if(!ui.update&&!busy){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=busy?'<span>Nieuwe versie laden…</span>':'<span>Er is een nieuwe versie van Pierenworp.</span><button class="up-btn" data-act="update">Vernieuwen</button>';
}
window.__pwShowUpdate=fn=>{ ui.update=fn; renderUpdate(); };
let aiTimer=null, stallTimer=null;
let ON=null;       // online sessie: {code, uid, ver, isHost, ...}
let R=null;        // online kamer: {status, host, seats, S}
let stashS=null;   // het spel op deze telefoon, bewaard zolang je online speelt
const AI_STALL=9000, HUMAN_STALL=90000, AUTO_NEXT=2600;

/* ---------- geluid: dobbelstenen, live opgewekt met Web Audio ---------- */
let actx=null, master=null, noiseBuf=null;
function audio(){
  if(!soundOn()) return null;
  try{
    if(!actx){
      // iOS 17+: speel af als 'media', zodat de stilteknop het geluid niet dempt
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      actx=new C();
      const comp=actx.createDynamicsCompressor();
      master=actx.createGain(); master.gain.value=0.9;
      master.connect(comp).connect(actx.destination);
    }
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){return null}
}
function noise(ctx){
  if(noiseBuf) return noiseBuf;
  const len=Math.floor(ctx.sampleRate*0.06), b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  return noiseBuf=b;
}
function clack(ctx,t,vol){
  const src=ctx.createBufferSource(); src.buffer=noise(ctx);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=1800+Math.random()*2600; bp.Q.value=2.5+Math.random()*3;
  const g=ctx.createGain(), end=t+0.03+Math.random()*0.03;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,end);
  src.connect(bp).connect(g).connect(master); src.start(t); src.stop(end+0.01);
  const o=ctx.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(600+Math.random()*700,t);
  const og=ctx.createGain();
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(vol*0.45,t+0.002); og.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
  o.connect(og).connect(master); o.start(t); o.stop(t+0.05);
}
function withCtx(fn){
  const ctx=audio(); if(!ctx) return;
  if(ctx.state==='running') fn(ctx);
  else ctx.resume().then(()=>{ if(ctx.state==='running') fn(ctx); }).catch(()=>{});
}
let silentUrl=null, unlocked=false;
function silentWav(){
  if(silentUrl) return silentUrl;
  const n=800, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  return silentUrl=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
// Geluid ontgrendelen binnen een echte tik (touchend/click tellen op iOS, pointerdown niet)
function unlockAudio(){
  if(!soundOn()) return;
  const ctx=audio(); if(!ctx) return;
  if(ctx.state!=='running'){ try{ctx.resume()}catch(e){} }
  if(!unlocked){
    unlocked=true;
    try{ const b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0); }catch(e){}
    try{ const el=new Audio(silentWav()); el.setAttribute('playsinline',''); const p=el.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  }
}
function playRoll(n){ withCtx(ctx=>rollSound(ctx,n)); }
function rollSound(ctx,n){
  const now=ctx.currentTime+0.02;
  for(let i=0;i<8+n*2;i++) clack(ctx,now+Math.random()*0.18,0.04+Math.random()*0.05);
  for(let d=0;d<n;d++){
    let t=now+0.2+Math.random()*0.14, gap=0.08+Math.random()*0.05, v=0.16+Math.random()*0.1;
    const bounces=2+Math.floor(Math.random()*2);
    for(let k=0;k<bounces;k++){ clack(ctx,t,v); t+=gap; gap*=0.55; v*=0.45; }
  }
}
function playDing(){
  withCtx(ctx=>{
    const now=ctx.currentTime+0.02;
    [[880,0],[1318.5,0.13]].forEach(([f,d])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,now+d); g.gain.exponentialRampToValueAtTime(0.22,now+d+0.01); g.gain.exponentialRampToValueAtTime(0.0001,now+d+0.45);
      o.connect(g).connect(master); o.start(now+d); o.stop(now+d+0.5);
    });
  });
}
function playSetAside(n){
  withCtx(ctx=>{
    const now=ctx.currentTime+0.01;
    for(let i=0;i<Math.min(n,5);i++) clack(ctx,now+i*0.045,0.09);
  });
}

/* ---------- opslag ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({S:ON?stashS:S,seats,pref}))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}

/* ---------- spellogica ---------- */
const T=()=>S.turn, P=()=>S.players[S.cur];
const total=t=>t.kept.reduce((a,f)=>a+val(f),0);
const hasWorm=t=>t.kept.includes(6);
const left=t=>8-t.kept.length;
const canPickAny=t=>{const k=new Set(t.kept);return t.rolled.some(f=>!k.has(f))};
const score=p=>p.stack.reduce((a,n)=>a+wormsOf(n),0);
const humans=()=>S.players.filter(p=>!p.ai).length;

function target(){
  const t=T(), s=total(t);
  if(!hasWorm(t)||s<21) return null;
  for(let i=0;i<S.players.length;i++){
    if(i===S.cur) continue;
    const st=S.players[i].stack;
    if(st.length&&st[st.length-1]===s) return {type:'steal',from:i,n:s};
  }
  let best=null;
  for(const c of S.center) if(c.st==='open'&&c.n<=s) best=c.n;
  return best?{type:'center',n:best}:null;
}
function freshTurn(){return {rolled:[],kept:[],phase:'roll'}}
const isMine=()=>{ if(!S||S.over) return false; const p=P(); if(p.ai) return false; return !ON||p.uid===ON.uid; };
function decideMsg(tg){
  const t=T(), s=total(t);
  if(tg){
    const what=tg.type==='steal'?`tegel ${tg.n} van ${esc(S.players[tg.from].name)} afpikken`:`tegel ${tg.n} pakken`;
    return left(t)?`Je kunt ${what}, of verder gooien met ${left(t)} ${left(t)===1?'steen':'stenen'}.`:`Je kunt ${what}.`;
  }
  if(!hasWorm(t)&&s>=21) return 'Je hebt genoeg ogen, maar nog geen pier. Gooi verder.';
  if(s<21) return `Nog ${21-s} te gaan tot 21. Gooi verder.`;
  return 'Geen tegel binnen bereik. Gooi verder.';
}
/* De tekst onderin wordt per telefoon bepaald: wie aan de beurt is, krijgt 'jij'-teksten, de rest ziet de naam. */
function statusMsg(){
  const t=T(), p=P(), name=`<b>${esc(p.name)}</b>`, mine=isMine(), s=total(t);
  if(t.phase==='roll'){
    if(!mine) return `${name} is aan de beurt.`;
    if(ON) return '<b>Jij bent aan de beurt!</b> Gooi de stenen.';
    return (!ON&&humans()>1)?`${name}, jouw beurt. Gooi de stenen.`:'Jouw beurt. Gooi de stenen.';
  }
  if(t.phase==='pick'){
    if(t.choice!=null){ const c=t.rolled.filter(x=>x===t.choice).length; return `${name} kiest ${c} × <span class="inline-die" aria-label="${faceName(t.choice)}">${dieSVG(t.choice)}</span>`; }
    if(mine) return 'Tik een steen aan om alle stenen met die waarde apart te leggen.';
    return `${name} gooit ${t.rolled.length} ${t.rolled.length===1?'steen':'stenen'}.`;
  }
  if(t.phase==='decide'){
    if(mine) return decideMsg(target());
    return `${name} heeft ${s}${hasWorm(t)?' met pier':''}…`;
  }
  return '';
}

function newState(players){
  return {players:players.map(p=>({...p,stack:[]})),center:Array.from({length:16},(_,i)=>({n:21+i,st:'open'})),
    cur:0,turn:freshTurn(),over:false,seq:0,ev:{k:'start'}};
}
function startGame(){
  const act=seats.map((s,i)=>({...s,seat:i})).filter(s=>s.type!=='uit');
  if(act.length<2){ui.err='Kies minstens twee spelers.';render();return}
  ui.err='';
  S=newState(act.map((s,i)=>({name:(s.name||'').trim()||(s.type==='computer'?AI_NAMES[i%AI_NAMES.length]:'Speler '+(i+1)),ai:s.type==='computer',c:s.seat})));
  commit();
}

function doRoll(){
  const t=T();
  if(!(t.phase==='roll'||(t.phase==='decide'&&left(t)>0))) return;
  t.rolled=Array.from({length:left(t)},()=>1+Math.floor(Math.random()*6));
  t.choice=null;
  S.ev={k:'roll',n:t.rolled.length};
  if(!canPickAny(t)) bust('Geen enkele nieuwe waarde gegooid.');
  else t.phase='pick';
  commit();
}
function doPick(f){
  const t=T();
  if(t.phase!=='pick'||t.kept.includes(f)||!t.rolled.includes(f)) return;
  const picked=t.rolled.filter(x=>x===f);
  t.kept.push(...picked);
  t.rolled=[]; t.choice=null;
  S.ev={k:'pick',n:picked.length};
  const tg=target();
  if(left(t)===0&&!tg) bust('Alle stenen liggen apart, maar er valt niets te pakken.');
  else t.phase='decide';
  commit();
}
function doStop(){
  const t=T(); if(t.phase!=='decide') return;
  const tg=target(); if(!tg) return;
  const me=P();
  if(tg.type==='steal'){
    const v=S.players[tg.from]; v.stack.pop(); me.stack.push(tg.n);
    t.result={kind:'steal',n:tg.n,from:v.name};
  }else{
    S.center.find(c=>c.n===tg.n).st='taken'; me.stack.push(tg.n);
    t.result={kind:'take',n:tg.n};
  }
  t.phase='done'; t.rolled=[];
  S.ev={k:'stop'};
  commit();
}
function bust(reason){
  const t=T(), me=P();
  t.phase='done';
  let back=null;
  if(me.stack.length){ back=me.stack.pop(); S.center.find(c=>c.n===back).st='open'; }
  const open=S.center.filter(c=>c.st==='open');
  const hi=open[open.length-1];
  let flipped=null;
  if(hi&&hi.n!==back){ hi.st='flipped'; flipped=hi.n; }
  t.result={kind:'bust',reason,back,flipped};
}
function advance(){
  if(T().phase!=='done') return;
  if(!S.center.some(c=>c.st==='open')) S.over=true;
  else { S.cur=(S.cur+1)%S.players.length; S.turn=freshTurn(); }
  S.ev={k:'next'};
  commit();
}
/* Animaties en geluid bij een nieuwe zet: van jezelf, of binnengekomen van een andere telefoon */
function fx(ev){
  ui.fresh=false; ui.newKept=0;
  if(!ev) return;
  if(ev.k==='roll'){ ui.fresh=true; playRoll(ev.n); }
  else if(ev.k==='pick'){ ui.newKept=ev.n; playSetAside(ev.n); }
}
function commit(){
  S.seq=(S.seq||0)+1;
  fx(S.ev);
  if(ON){ R.S=S; push(); } else save();
  render(); schedule();
}

/* ---------- computerspeler ---------- */
/* De computer rekent per beurt uit wat elke keuze gemiddeld oplevert:
   alle mogelijke worpen, alle waarden die hij apart kan leggen, en of stoppen
   meer pieren oplevert dan doorgooien (met het risico de bovenste tegel kwijt te raken). */
const OUT=(()=>{                       // alle uitkomsten van n stenen, met hun kans
  const fact=[1]; for(let i=1;i<=8;i++) fact[i]=fact[i-1]*i;
  const out=[[[[0,0,0,0,0,0,0],1]]];
  for(let n=1;n<=8;n++){
    const list=[], c=[0,0,0,0,0,0,0];
    (function rec(face,rest){
      if(face===6){ c[6]=rest; let m=fact[n]; for(let f=1;f<=6;f++) m/=fact[c[f]]; list.push([c.slice(),m/Math.pow(6,n)]); return; }
      for(let k=0;k<=rest;k++){ c[face]=k; rec(face+1,rest-k); }
    })(1,n);
    out.push(list);
  }
  return out;
})();
function planner(){
  const me=S.cur, opp=Math.max(1,S.players.length-1);
  const open=S.center.filter(c=>c.st==='open').map(c=>c.n);
  const tops={};
  S.players.forEach((p,i)=>{ if(i!==me&&p.stack.length) tops[p.stack[p.stack.length-1]]=true; });
  const mine=P().stack, myTop=mine.length?mine[mine.length-1]:null;
  // mislukken: je bovenste tegel kwijt, en een tegel minder in het spel
  const bustV=-(myTop?wormsOf(myTop):0)-0.3;
  const stopV=[];
  for(let s=0;s<=40;s++){
    if(s<21){stopV[s]=null;continue}
    let best=null; for(const n of open) if(n<=s) best=n;
    let v=best?wormsOf(best):null;
    if(tops[s]){ const sv=wormsOf(s)*(1+1/opp); v=v==null?sv:Math.max(v,sv); }  // afpikken telt dubbel bij twee spelers
    stopV[s]=v;
  }
  const memo=new Map();
  function V(mask,sum,n){            // waarde na het apart leggen: stoppen of doorgooien
    const key=mask*1000+sum*10+n;
    if(memo.has(key)) return memo.get(key);
    const sv=(mask&64)&&stopV[sum]!=null?stopV[sum]:-Infinity;
    const rv=n>0?R(mask,sum,n):-Infinity;
    let v=Math.max(sv,rv); if(v===-Infinity) v=bustV;
    memo.set(key,v); return v;
  }
  function R(mask,sum,n){            // verwachte waarde van gooien met n stenen
    let e=0;
    for(const [c,p] of OUT[n]){
      let best=-Infinity;
      for(let f=1;f<=6;f++) if(c[f]&&!(mask&(1<<f))){ const v=V(mask|(1<<f),sum+c[f]*val(f),n-c[f]); if(v>best) best=v; }
      e+=p*(best===-Infinity?bustV:best);
    }
    return e;
  }
  return {V,R,stopV};
}
const maskOf=t=>t.kept.reduce((m,f)=>m|(1<<f),0);
function aiPick(t){
  const pl=planner(), mask=maskOf(t), sum=total(t), n=left(t);
  let best=null, bv=-Infinity;
  for(let f=1;f<=6;f++){
    if(mask&(1<<f)) continue;
    const c=t.rolled.filter(x=>x===f).length; if(!c) continue;
    const v=pl.V(mask|(1<<f),sum+c*val(f),n-c);
    if(v>bv+1e-9){bv=v;best=f}
  }
  return best;
}
function aiShouldStop(t){
  const tg=target(); if(!tg) return false;
  const n=left(t); if(n===0) return true;
  const pl=planner(), sum=total(t);
  return pl.stopV[sum]>=pl.R(maskOf(t),sum,n);
}
function schedule(){
  clearTimeout(aiTimer); clearTimeout(stallTimer);
  if(!S||S.over) return;
  const t=T(), sp=pref.fast?0.45:1;
  if(P().ai){
    // pick: eerst de worp laten zien, daarna de gekozen stenen laten oplichten
    const d=t.phase==='pick'?(t.choice==null?1500:1300):({roll:800,decide:1300,done:2800}[t.phase]||900);
    if(!ON||ON.isHost) aiTimer=setTimeout(aiStep,d*sp);
    // online speelt de starter voor de computer; valt die weg, dan neemt een andere telefoon het over
    else aiTimer=setTimeout(()=>{ if(ON&&Date.now()-ON.changed>=AI_STALL) aiStep(); else schedule(); },AI_STALL);
  } else if(ON&&isMine()&&t.phase==='done'){
    aiTimer=setTimeout(()=>{ if(isMine()&&T().phase==='done') advance(); },AUTO_NEXT);
  } else if(ON&&!isMine()){
    const wait=HUMAN_STALL-(Date.now()-ON.changed);
    if(wait>0) stallTimer=setTimeout(()=>{render();schedule();},wait+200);
  }
}
function aiStep(){
  if(!S||S.over||!P().ai) return;
  const t=T();
  if(t.phase==='roll') doRoll();
  else if(t.phase==='pick'){
    if(t.choice==null){ t.choice=aiPick(t); S.ev={k:'choice'}; commit(); }
    else doPick(t.choice);
  }
  else if(t.phase==='decide'){ if(aiShouldStop(t)) doStop(); else doRoll(); }
  else if(t.phase==='done') advance();
}

/* ---------- tekenwerk ---------- */
const PIPS={1:[[20,20]],2:[[12.5,12.5],[27.5,27.5]],3:[[12.5,12.5],[20,20],[27.5,27.5]],4:[[12.5,12.5],[27.5,12.5],[12.5,27.5],[27.5,27.5]],5:[[12.5,12.5],[27.5,12.5],[20,20],[12.5,27.5],[27.5,27.5]]};

/* De stand van een online spel staat in Firebase onder pierenworp/rooms/CODE als { d: JSON-tekst, rev: volgnummer, t: tijd }.
   Wie een zet doet, schrijft de nieuwe stand weg met een transactie die controleert of niemand anders er tussendoor kwam. */
const FIREBASE_CONFIG={
  apiKey:'AIzaSyC_ZlhmqLBPzc_czjbswY05M0NcgY_DU7E',
  authDomain:'pierenworp.firebaseapp.com',
  databaseURL:'https://pierenworp-default-rtdb.europe-west1.firebasedatabase.app',

};
const FB_SDK='https://www.gstatic.com/firebasejs/10.12.2/';
const ROOMS='pierenworp/rooms/';
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ';
let netP=null;
const useMock=()=>/[?&]mock\b/.test(location.search);
const netReady=()=>useMock()||!!FIREBASE_CONFIG;
function getNet(){
  if(netP) return netP;
  if(useMock()) return netP=Promise.resolve(mockNet());
  if(!FIREBASE_CONFIG) return Promise.reject(new Error('config'));
  netP=(async()=>{
    const [A,U,D]=await Promise.all([import(FB_SDK+'firebase-app.js'),import(FB_SDK+'firebase-auth.js'),import(FB_SDK+'firebase-database.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    const auth=U.getAuth(app);
    await new Promise(res=>{ const off=U.onAuthStateChanged(auth,()=>{ off(); res(); }); });
    if(!auth.currentUser) await U.signInAnonymously(auth);
    const db=D.getDatabase(app);
    return {
      uid:auth.currentUser.uid,
      sub(code,cb,err){ return D.onValue(D.ref(db,ROOMS+code),s=>cb(s.val()),e=>err&&err(e)); },
      async tx(code,fn){ const r=await D.runTransaction(D.ref(db,ROOMS+code),fn,{applyLocally:false}); return {committed:r.committed,val:r.snapshot.val()}; },
      kick(){ try{ D.goOffline(db); D.goOnline(db); }catch(e){} }     // na terugkomen in de app meteen opnieuw verbinden
    };
  })();
  netP.catch(()=>{ netP=null; });
  return netP;
}
/* Nep-database om online spelen te testen in twee vensters van dezelfde browser (adres met ?mock) */
function mockNet(){
  let uid=sessionStorage.getItem('pw-mock-uid');
  if(!uid){ uid='u'+Math.random().toString(36).slice(2,8); sessionStorage.setItem('pw-mock-uid',uid); }
  const bc=new BroadcastChannel('pw-mock'), subs=new Map();
  const rd=c=>{ try{ return JSON.parse(localStorage.getItem('pw-mock:'+c)); }catch(e){ return null; } };
  const fire=c=>(subs.get(c)||[]).forEach(f=>f(rd(c)));
  bc.onmessage=e=>fire(e.data);
  return {
    uid, kick(){},
    sub(code,cb){ subs.set(code,[...(subs.get(code)||[]),cb]); setTimeout(()=>cb(rd(code)),20); return ()=>subs.set(code,(subs.get(code)||[]).filter(f=>f!==cb)); },
    async tx(code,fn){
      await new Promise(r=>setTimeout(r,40));
      const cur=rd(code), nv=fn(cur);
      if(nv===undefined) return {committed:false,val:cur};
      if(nv===null) localStorage.removeItem('pw-mock:'+code); else localStorage.setItem('pw-mock:'+code,JSON.stringify(nv));
      bc.postMessage(code); setTimeout(()=>fire(code),30);
      return {committed:true,val:nv};
    }
  };
}
const newCode=()=>Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const wrap=(d,rev)=>({d:typeof d==='string'?d:JSON.stringify(d),rev,t:Date.now()});
function parseRoom(v){ try{ const d=JSON.parse(v.d); return {status:d.status,host:d.host,seats:d.seats||[],S:d.S||null}; }catch(e){ return null; } }

let busy=0, latest, queue=Promise.resolve();
function run(job){
  busy++;
  const p=queue.then(job).catch(e=>{ if(ON) ON.dirty=true; console.warn(e); })
    .finally(()=>{ busy--; if(!busy) applyLatest(); });
  queue=p.catch(()=>{});
  return p;
}
/* een zet wegschrijven: alleen als de stand op de server nog dezelfde is als waar deze zet op voortbouwt */
function push(){
  if(!ON) return;
  const data=JSON.stringify({status:R.status,host:R.host,seats:R.seats,S:R.S}), code=ON.code;
  run(async()=>{
    const net=await getNet();
    if(!ON||ON.code!==code||ON.ver==null) return;
    const base=ON.ver;
    const r=await net.tx(code,cur=>{ if(cur===null) return null; if(cur.rev!==base) return; return wrap(data,base+1); });
    if(!ON) return;
    if(r.committed&&r.val){ ON.ver=r.val.rev; ON.changed=Date.now(); } else ON.dirty=true;
  });
}
/* wachtkamer, verlaten en overnemen: een wijziging op de actuele stand van de server */
function mutateRoom(fn){
  if(!ON) return Promise.resolve();
  const code=ON.code, uid=ON.uid;
  return run(async()=>{
    const net=await getNet();
    return net.tx(code,cur=>{
      if(cur===null) return null;
      const d=parseRoom(cur); if(!d) return;
      const nd=fn(d,uid);
      if(nd===undefined) return;
      return nd===null?null:wrap(nd,(cur.rev||0)+1);
    });
  });
}
function onRoom(v){ latest=v; if(!busy) applyLatest(); }
function yourTurn(){
  playDing();
  try{ navigator.vibrate&&navigator.vibrate([70,50,70]); }catch(e){}
  ui.ping=true;
}
function applyLatest(){
  if(!ON||latest===undefined) return;
  const v=latest;
  if(v===null){ endOnline('Dit online spel bestaat niet meer.'); return; }
  if(ON.applied&&!ON.dirty&&v.rev<=ON.ver) return;
  const d=parseRoom(v); if(!d) return;
  const wasMine=isMine();
  const prevSeq=S?(S.seq||0):0;
  ON.ver=v.rev; ON.applied=true; ON.dirty=false; ON.changed=Date.now();
  R=d; ON.isHost=R.host===ON.uid;
  if(R.status==='lobby'){
    S=null;
    if(!R.seats.some(s=>s.id===ON.uid)){ endOnline('Je doet niet meer mee aan dit spel.'); return; }
  } else {
    S=R.S;
    if(S&&(S.seq||0)>prevSeq) fx(S.ev); else ui.fresh=false;
    if(!wasMine&&isMine()) yourTurn();
  }
  render(); schedule();
}
function netError(e){
  const m=String(e&&(e.code||e.message)||'');
  ui.netBusy='';
  ui.netErr=m==='config'?'Online spelen is nog niet ingesteld.'
    :/permission/i.test(m)?'De online database weigert de toegang. Controleer de regels in Firebase.'
    :'Er ging iets mis met de verbinding. Controleer je internet en probeer het opnieuw.';
  render();
}
function enterOnline(code){
  if(!ON) stashS=S;
  clearTimeout(aiTimer); clearTimeout(stallTimer);
  S=null; R=null; latest=undefined;
  ui.confirm=false; ui.netErr=''; ui.netMsg=''; ui.netBusy='Verbinden…'; ui.mode='online';
  ON={code,uid:null,ver:null,applied:false,dirty:false,isHost:false,changed:Date.now(),unsub:null};
  pref.online={code}; pref.mode='online'; save();
  render();
  const me=ON;
  getNet().then(net=>{
    if(ON!==me) return;
    me.uid=net.uid;
    me.unsub=net.sub(code,onRoom,()=>{ if(ON===me) endOnline('De verbinding met het online spel is verbroken.',true); });
    ui.netBusy='';
  }).catch(e=>{ if(ON===me){ endOnline('',true); netError(e); } });
}
function endOnline(msg,keep){
  if(ON&&ON.unsub) try{ ON.unsub(); }catch(e){}
  clearTimeout(aiTimer); clearTimeout(stallTimer);
  ON=null; R=null; latest=undefined;
  S=stashS; stashS=null;
  if(!keep) pref.online=null;
  ui.confirm=false; ui.netBusy=''; ui.netMsg=msg||''; ui.mode='online';
  save(); render(); schedule();
}
function nameOk(){
  const name=(pref.name||'').trim();
  if(!name){ ui.netErr='Vul eerst je naam in.'; render(); return null; }
  return name.slice(0,14);
}
async function createOnline(){
  const name=nameOk(); if(!name) return;
  ui.netBusy='Spel aanmaken…'; ui.netErr=''; ui.netMsg=''; render();
  try{
    const net=await getNet();
    for(let i=0;i<8;i++){
      const code=newCode();
      const room={status:'lobby',host:net.uid,seats:[{id:net.uid,name}],S:null};
      const r=await net.tx(code,cur=>cur===null?wrap(room,1):undefined);
      if(r.committed){ enterOnline(code); return; }
    }
    throw new Error('code');
  }catch(e){ netError(e); }
}
async function joinOnline(){
  const code=(ui.joinCode||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(code.length!==4){ ui.netErr='Een code bestaat uit vier letters.'; render(); return; }
  const name=nameOk(); if(!name) return;
  ui.netBusy='Meedoen…'; ui.netErr=''; ui.netMsg=''; render();
  try{
    const net=await getNet(); let why='';
    const r=await net.tx(code,cur=>{
      why='';
      if(cur===null) return null;
      const d=parseRoom(cur); if(!d){ why='kapot'; return; }
      if(d.seats.some(s=>s.id===net.uid)){
        if(d.status!=='lobby') return;                    // je zat al aan tafel: gewoon weer aansluiten
        d.seats=d.seats.map(s=>s.id===net.uid?{...s,name}:s); return wrap(d,cur.rev+1);
      }
      if(d.status!=='lobby'){ why='begonnen'; return; }
      if(d.seats.length>=6){ why='vol'; return; }
      d.seats.push({id:net.uid,name}); return wrap(d,cur.rev+1);
    });
    ui.netBusy='';
    if(r.val===null||why==='kapot'){ ui.netErr=`Er is geen spel met de code ${code}.`; render(); return; }
    if(why==='begonnen'){ ui.netErr='Dit spel is al begonnen. Vraag de starter om een nieuw potje.'; render(); return; }
    if(why==='vol'){ ui.netErr='Dit spel zit al vol: er doen zes spelers mee.'; render(); return; }
    ui.joinCode='';
    enterOnline(code);
  }catch(e){ netError(e); }
}
async function leaveOnline(){
  if(!ON) return;
  if(ON.uid){
    try{
      await mutateRoom((d,uid)=>{
        const others=d.seats.filter(s=>!s.ai&&s.id!==uid);
        if(d.status==='lobby') d.seats=d.seats.filter(s=>s.id!==uid);
        else{
          d.seats=d.seats.map(s=>s.id===uid?{...s,ai:true}:s);
          if(d.S&&!d.S.over) d.S.players.forEach(p=>{ if(p.uid===uid) p.ai=true; });
        }
        if(!others.length) return null;                  // laatste mens weg: kamer opruimen
        if(d.host===uid) d.host=others[0].id;
        return d;
      });
    }catch(e){}
  }
  endOnline('');
}
function addComputer(){
  mutateRoom(d=>{
    if(d.status!=='lobby'||d.seats.length>=6) return;
    const used=new Set(d.seats.map(s=>s.name));
    d.seats.push({id:'ai-'+Math.random().toString(36).slice(2,8),name:AI_NAMES.find(n=>!used.has(n))||'Robot',ai:true});
    return d;
  });
}
function removeSeat(id){ mutateRoom(d=>{ if(d.status!=='lobby') return; d.seats=d.seats.filter(s=>s.id!==id||!s.ai); return d; }); }
function startOnline(){
  mutateRoom((d,uid)=>{
    if(d.status!=='lobby'||d.host!==uid||d.seats.length<2) return;
    d.status='play';
    d.S=newState(d.seats.map((s,i)=>({name:s.name,ai:!!s.ai,uid:s.id,c:i}))); d.S.seq=1;
    return d;
  });
}
function againOnline(){
  mutateRoom((d,uid)=>{
    if(!d.S||!d.S.over||d.host!==uid) return;
    d.S=newState(d.S.players.map(p=>({name:p.name,ai:p.ai,uid:p.uid,c:p.c}))); d.S.seq=1;
    return d;
  });
}
function takeOver(i){
  mutateRoom(d=>{
    const p=d.S&&d.S.players[i]; if(!p||p.ai) return;
    p.ai=true;
    d.seats=d.seats.map(s=>s.id===p.uid?{...s,ai:true}:s);
    if(d.host===p.uid){ const h=d.seats.find(s=>!s.ai); if(h) d.host=h.id; }
    return d;
  });
}
function reclaim(){
  mutateRoom((d,uid)=>{
    const p=d.S&&d.S.players.find(q=>q.uid===uid); if(!p||!p.ai) return;
    p.ai=false; d.seats=d.seats.map(s=>s.id===uid?{...s,ai:false}:s);
    return d;
  });
}
async function shareInvite(){
  if(!ON) return;
  const url=location.origin+location.pathname+'#'+ON.code;
  const text=`Doe mee met mijn potje Pierenworp! De code is ${ON.code}.`;
  if(navigator.share){ try{ await navigator.share({title:'Pierenworp',text,url}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text+' '+url); toast('Uitnodiging gekopieerd'); }
  catch(e){ toast(`Geef je medespelers de code ${ON.code}`); }
}
let toastTimer=null;
function toast(m){
  const el=document.getElementById('toast'); if(!el) return;
  el.textContent=m; el.hidden=false; clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ el.hidden=true; },2600);
}

/* ---------- schermen ---------- */
function headerHTML(kind){
  const snd=soundOn();
  let extra='';
  if(kind==='game'&&(!ON||ON.isHost)) extra+=`<button class="ib" data-act="fast" aria-pressed="${!!pref.fast}" aria-label="Vlot tempo voor computerspelers" title="Vlot tempo">${ICON.fast}</button>`;
  if(ON) extra+=`<button class="ib" data-act="ask-leave" aria-label="Online spel verlaten" title="Verlaten">${ICON.leave}</button>`;
  else if(kind==='game') extra+=`<button class="ib" data-act="ask-new" aria-label="Nieuw spel" title="Nieuw spel">${ICON.restart}</button>`;
  return `<header class="top">${logoHTML()}<div class="icons">
    <button class="ib" data-act="sound" aria-pressed="false" aria-label="${snd?'Geluid uitzetten':'Geluid aanzetten'}" title="${snd?'Geluid staat aan':'Geluid staat uit'}">${snd?ICON.soundOn:ICON.soundOff}</button>
    ${extra}
  </div></header>`;
}

function setupHTML(){
  const online=ui.mode==='online';
  const tabs=`<div class="seg modes" role="group" aria-label="Manier van spelen">
    <button data-act="mode" data-m="local" aria-pressed="${!online}">Op deze telefoon</button>
    <button data-act="mode" data-m="online" aria-pressed="${online}">Online</button></div>`;
  let body;
  if(!online){
    const rows=seats.map((s,i)=>`<div class="seat${s.type==='uit'?' off':''}">
      ${avatar(s.name,i)}
      <input id="seat-name-${i}" data-seat="${i}" value="${esc(s.name)}" maxlength="14" aria-label="Naam speler ${i+1}" autocomplete="off">
      <div class="seg" role="group" aria-label="Soort speler ${i+1}">
        ${['mens','computer','uit'].map(tp=>`<button data-act="seat" data-i="${i}" data-type="${tp}" aria-pressed="${s.type===tp}">${tp==='mens'?'Mens':tp==='computer'?'Computer':'Uit'}</button>`).join('')}
      </div></div>`).join('');
    body=`<section><p class="label">Spelers</p><div class="seats">${rows}</div></section>
    ${ui.err?`<p class="err" role="alert">${ui.err}</p>`:''}
    ${rulesHTML()}
    <p class="foot">Mensen spelen om de beurt op hetzelfde toestel.</p>`;
  } else {
    const off=!netReady();
    const resume=pref.online&&pref.online.code;
    const creating=ui.netBusy==='Spel aanmaken…', joining=ui.netBusy==='Meedoen…', dis=off||!!ui.netBusy;
    const invited=!!ui.joinCode&&ui.joinCode.length===4;
    const startCard=`<div class="choice">
        <div class="choice-head"><span class="choice-icon start">${ICON.plus}</span><div><h3>Nieuw spel starten</h3><p>Je krijgt een code van vier letters die je deelt met je medespelers.</p></div></div>
        <button class="btn go" data-act="create" ${dis?'disabled':''}>${creating?'Spel aanmaken…':'Start een spel'}</button></div>`;
    const joinCard=`<div class="choice${invited?' invited':''}">
        <div class="choice-head"><span class="choice-icon join">${ICON.enter}</span><div><h3>Meedoen met een code</h3><p>${invited?'Je bent uitgenodigd. Vul je naam in en doe mee.':'Heb je een code gekregen? Vul hem hier in.'}</p></div></div>
        <div class="join-row"><input id="on-code" class="field code" data-ui="joinCode" value="${esc(ui.joinCode||'')}" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Code van het spel">
        <button class="btn" data-act="join" ${dis?'disabled':''}>${joining?'Meedoen…':'Doe mee'}</button></div></div>`;
    body=`<section class="online">
      ${off?`<p class="notice">Online spelen wordt nog ingesteld. Zodra dat klaar is, kun je hier een spel starten.</p>`:''}
      ${ui.netMsg?`<p class="notice">${esc(ui.netMsg)}</p>`:''}
      ${resume?`<div class="notice resume"><span>Je speelde mee met spel <b>${esc(pref.online.code)}</b>.</span><button class="btn soft small" data-act="reconnect">Opnieuw verbinden</button></div>`:''}
      <div class="fieldset"><label class="label" for="on-name">Jouw naam</label>
        <input id="on-name" class="field" data-pref="name" value="${esc(pref.name||'')}" maxlength="14" placeholder="Bijvoorbeeld Rob" autocomplete="nickname"></div>
      ${ui.netErr?`<p class="err" role="alert">${esc(ui.netErr)}</p>`:''}
      ${invited?joinCard+startCard:startCard+joinCard}
      <p class="foot">Iedereen speelt op zijn eigen telefoon.</p>
    </section>
    ${rulesHTML()}`;
  }
  return headerHTML('setup')+`
  <section class="hero"><h2>Gooi, kies en <em>durf</em> door te gaan.</h2>
  <p class="lede">Gooi acht dobbelstenen, leg telkens één waarde apart en verzamel tegels met zoveel mogelijk pieren.</p></section>
  ${tabs}${body}`;
}

function connectingHTML(){
  return headerHTML('lobby')+`<section class="hero"><p class="label">Online spel ${ON?esc(ON.code):''}</p><h2>Verbinden…</h2>
  <p class="lede">Even geduld, we halen het spel op.</p></section>`;
}

function lobbyHTML(){
  const host=R.seats.find(s=>s.id===R.host);
  const rows=R.seats.map((s,i)=>{
    const tags=[];
    if(s.id===ON.uid) tags.push('<span class="tag me">jij</span>');
    if(s.id===R.host) tags.push('<span class="tag">starter</span>');
    if(s.ai) tags.push('<span class="tag">computer</span>');
    const del=ON.isHost&&s.ai?`<button class="x" data-act="del-seat" data-id="${esc(s.id)}" aria-label="${esc(s.name)} verwijderen">${ICON.close}</button>`:'';
    return `<div class="lobby-seat">${avatar(s.name,i)}<span class="nm">${esc(s.name)}</span>${tags.join('')}${del}</div>`;
  }).join('');
  const add=ON.isHost&&R.seats.length<6?`<button class="addai" data-act="add-ai">${ICON.plus}Computerspeler toevoegen</button>`:'';
  return headerHTML('lobby')+`
  <section class="hero"><p class="label">Wachtkamer</p><h2>Deel de code met je <em>medespelers</em></h2></section>
  <div class="codebox">
    <div class="code-letters" aria-label="Code ${ON.code.split('').join(' ')}">${ON.code.split('').map(c=>`<span>${c}</span>`).join('')}</div>
    <button class="btn soft small" data-act="share">${ICON.share}Deel uitnodiging</button>
  </div>
  <section><p class="label">Spelers · ${R.seats.length} van 6</p><div class="seats">${rows}${add}</div></section>
  <p class="foot">${ON.isHost?'Wie meedoet, verschijnt hier vanzelf. Start als iedereen er is.':`${esc(host?host.name:'De starter')} kan nog computerspelers toevoegen en start het spel.`}</p>`;
}

function gameHTML(){
  const t=T(), me=P(), tg=(t.phase==='decide')?target():null;

  const players=S.players.map((p,i)=>{
    const top=p.stack.length?p.stack[p.stack.length-1]:null;
    const cls=['pcard'];
    if(i===S.cur) cls.push('is-cur');
    if(tg&&tg.type==='steal'&&tg.from===i) cls.push('is-victim');
    if(i===S.cur&&t.phase==='done'&&t.result&&t.result.kind!=='bust') cls.push('got');
    const k=p.stack.length, you=ON&&p.uid===ON.uid;
    return `<div class="${cls.join(' ')}">${avatar(p.name,p.c??i)}<div class="who"><div class="name">${esc(p.name)}${you?'<span class="you">jij</span>':''}</div><div class="meta"><span class="stat">${TILE_ICON}<b>${k}</b> ${k===1?'tegel':'tegels'}</span></div></div>${miniHTML(top)}</div>`;
  }).join('');

  const kf=new Set(t.kept), s=total(t), ready=hasWorm(t)&&s>=21;
  const firstNew=t.kept.length-ui.newKept;
  const keptDice=t.kept.length?t.kept.map((f,i)=>`<span class="die sm${i>=firstNew&&ui.newKept?' new':''}" style="--i:${i-firstNew}" title="${faceName(f)}">${dieSVG(f)}</span>`).join(''):'<span class="empty-tray">Nog niets apart gelegd</span>';
  ui.newKept=0;
  const choosing=t.phase==='pick'&&t.choice!=null;
  const canPick=isMine()&&t.phase==='pick'&&!choosing;
  const rolled=t.rolled.map((f,i)=>{
    const used=kf.has(f), dis=!canPick||used;
    const cls=['die']; if(used) cls.push('used'); if(choosing&&f===t.choice) cls.push('chosen');
    return `<button class="${cls.join(' ')}" style="--i:${i}" data-act="pick" data-f="${f}" ${dis?'disabled':''} aria-label="Leg alle ${f===6?'pieren':f+'-en'} apart">${dieSVG(f)}</button>`;
  }).join('');
  const pct=Math.min(s,40)/40*100;

  return headerHTML('game')+`
  <section aria-label="Tegelrooster"><div class="grill">${S.center.map(c=>tileHTML(c,tg)).join('')}</div></section>
  <section aria-label="Spelers"><div class="players">${players}</div></section>
  <section class="card" aria-label="Worp van ${esc(me.name)}">
    <p class="label" style="margin:0">Worp van ${esc(me.name)}</p>
    <div>
      <div class="score-row"><div class="tot">${s}<small>ogen</small></div><span class="chip${hasWorm(t)?' ok':''}">${WORM_ICON} ${hasWorm(t)?'pier binnen':'nog geen pier'}</span></div>
      <div class="meter-wrap" style="margin-top:12px">
        <div class="meter" role="progressbar" aria-label="Totaal" aria-valuemin="0" aria-valuemax="40" aria-valuenow="${s}"><div class="fill${ready?' ok':''}" style="width:${pct}%"></div><span class="mark" style="left:52.5%"></span></div>
        <div class="meter-legend"><span>0</span><span style="left:52.5%">21</span><span>40</span></div>
      </div>
    </div>
    <div class="tray" aria-label="Apart gelegd">${keptDice}</div>
    ${t.rolled.length?`<div class="divider"></div><div class="rolled${canPick?' can':''}${choosing?' choosing':''}${ui.fresh?' fresh':''}" id="rolled">${rolled}</div>`:''}
  </section>`;
}

function overHTML(){
  const ranked=S.players.map((p,i)=>({p,i,w:score(p),hi:p.stack.length?Math.max(...p.stack):0})).sort((a,b)=>b.w-a.w||b.hi-a.hi);
  const win=ranked[0];
  const youWin=ON?win.p.uid===ON.uid:(!win.p.ai&&humans()===1);
  const head=youWin?'Je hebt <em>gewonnen!</em>':`<em>${esc(win.p.name)}</em> wint!`;
  const CROWN='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 10H5z"/></svg>';
  const rows=ranked.map(r=>{
    const k=r.p.stack.length, isWin=r.w===win.w&&r.hi===win.hi, you=ON&&r.p.uid===ON.uid;
    const tiles=k?[...r.p.stack].sort((a,b)=>a-b).map(n=>miniHTML(n)).join(''):'<span class="no-tiles">Geen tegels</span>';
    return `<div class="prow${isWin?' win':''}"><div class="score"><b>${r.w}</b><span>${r.w===1?'pier':'pieren'}</span></div><div class="who"><span class="name">${esc(r.p.name)}${isWin?CROWN:''}</span>${you?'<span class="you">jij</span>':''}<span class="meta">${k} ${k===1?'tegel':'tegels'}</span></div><div class="ptiles" aria-label="Tegels van ${esc(r.p.name)}: ${k?r.p.stack.join(', '):'geen'}">${tiles}</div></div>`;
  }).join('');
  return headerHTML('over')+`
  <section class="hero"><p class="label">Uitslag</p><h2>${head}</h2></section>
  <div class="podium">${rows}</div>`;
}

const waitHTML=m=>`<div class="wait"><span class="dots"><i></i><i></i><i></i></span><span class="dock-msg" aria-live="polite">${m}</span></div>`;
function dockHTML(scr){
  if(ui.confirm==='new') return `<div class="dock-in" role="alertdialog" aria-label="Nieuw spel"><p>Dit spel stoppen en opnieuw beginnen?</p><button class="btn soft" data-act="cancel-new">Doorspelen</button><button class="btn" data-act="new">Nieuw spel</button></div>`;
  if(ui.confirm==='leave') return `<div class="dock-in" role="alertdialog" aria-label="Online spel verlaten"><p>Dit online spel verlaten?${S&&!S.over?' De computer speelt dan voor je verder.':''}</p><button class="btn soft" data-act="cancel-new">Blijven</button><button class="btn" data-act="leave">Verlaten</button></div>`;
  if(scr==='setup'){
    if(ui.mode!=='online') return `<div class="dock-in"><button class="btn go" data-act="start">Start het spel</button></div>`;
    if(ui.netBusy==='Verbinden…') return `<div class="dock-in">${waitHTML('Verbinden…')}</div>`;
    return '';
  }
  if(scr==='connecting') return `<div class="dock-in">${waitHTML('Verbinden…')}</div>`;
  if(scr==='lobby'){
    if(!ON.isHost){ const h=R.seats.find(s=>s.id===R.host); return `<div class="dock-in">${waitHTML(`Wachten tot <b>${esc(h?h.name:'de starter')}</b> het spel start`)}</div>`; }
    return `<div class="dock-in"><button class="btn go" data-act="start-online" ${R.seats.length<2?'disabled':''}>${R.seats.length<2?'Wachten op medespelers':'Start het spel'}</button></div>`;
  }
  if(scr==='over'){
    if(!ON) return `<div class="dock-in"><button class="btn" data-act="again">Nog een potje</button><button class="btn soft" data-act="new">Andere spelers</button></div>`;
    if(ON.isHost) return `<div class="dock-in"><button class="btn" data-act="again-online">Nog een potje</button><button class="btn soft" data-act="ask-leave">Verlaten</button></div>`;
    const h=R.seats.find(s=>s.id===R.host);
    return `<div class="dock-in">${waitHTML(`Wachten tot <b>${esc(h?h.name:'de starter')}</b> een nieuw potje start`)}<button class="btn soft" data-act="ask-leave">Verlaten</button></div>`;
  }
  const t=T(), me=P(), mine=isMine();
  let pre='';
  if(ON){
    const mineAi=S.players.find(p=>p.uid===ON.uid&&p.ai);
    if(mineAi) pre+=`<div class="banner"><span>De computer speelt nu voor jou.</span><button class="btn soft small" data-act="reclaim">Zelf verder spelen</button></div>`;
    if(!me.ai&&!mine&&Date.now()-ON.changed>HUMAN_STALL) pre+=`<div class="banner"><span><b>${esc(me.name)}</b> reageert niet.</span><button class="btn soft small" data-act="takeover" data-i="${S.cur}">Laat de computer spelen</button></div>`;
  }
  if(t.phase==='done'&&t.result){
    const r=resultHTML(t.result,me);
    if(!mine) return `<div class="dock-in">${pre}${r}${me.ai?'':waitHTML(`Wachten tot <b>${esc(me.name)}</b> verder gaat`)}</div>`;
    const nxt=S.players[(S.cur+1)%S.players.length];
    const end=!S.center.some(c=>c.st==='open');
    return `<div class="dock-in">${pre}${r}<button class="btn${ON?' autonext':''}" data-act="next" style="--auto:${AUTO_NEXT}ms">${end?'Bekijk de uitslag':`Verder naar ${esc(nxt.name)}`}</button></div>`;
  }
  if(!mine) return `<div class="dock-in">${pre}${waitHTML(statusMsg())}</div>`;
  let a=pre+`<p class="dock-msg" aria-live="polite">${statusMsg()}</p>`;
  if(t.phase==='roll') a+=`<button class="btn${ui.ping?' ping':''}" data-act="roll">Gooi ${left(t)} stenen</button>`;
  else if(t.phase==='decide'){
    const tg=target();
    if(tg) a+=`<button class="btn go" data-act="stop">${tg.type==='steal'?`Pik ${tg.n} af`:`Pak ${tg.n}`}</button>`;
    if(left(t)>0) a+=`<button class="btn${tg?' soft':''}" data-act="roll">Gooi verder (${left(t)})</button>`;
  }
  ui.ping=false;
  return `<div class="dock-in">${a}</div>`;
}

function screen(){
  if(ON){ if(!ON.applied||!R) return 'connecting'; if(R.status==='lobby') return 'lobby'; if(S) return S.over?'over':'game'; return 'connecting'; }
  return !S?'setup':S.over?'over':'game';
}
let pressing=0, renderLater=false;
function render(){
  if(pressing&&Date.now()-pressing<1500){ renderLater=true; return; }   // eerst de tik laten afmaken
  const app=document.getElementById('app'), dock=document.getElementById('dock');
  const ae=document.activeElement, focusId=ae&&ae.id, sel=ae&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
  const scr=screen();
  app.innerHTML=scr==='setup'?setupHTML():scr==='connecting'?connectingHTML():scr==='lobby'?lobbyHTML():scr==='over'?overHTML():gameHTML();
  const dh=dockHTML(scr); dock.innerHTML=dh; dock.hidden=!dh;
  const tt=ON&&scr==='game'&&isMine()?'● Jouw beurt · Pierenworp':'Pierenworp';
  if(document.title!==tt) document.title=tt;
  if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus(); if(sel!=null&&el.setSelectionRange) try{ el.setSelectionRange(sel,sel); }catch(e){} } }
}

/* ---------- invoer ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act;
  const myTurn=isMine();
  switch(a){
    case 'seat': seats[+b.dataset.i].type=b.dataset.type; ui.err=''; save(); render(); break;
    case 'mode': ui.mode=b.dataset.m; pref.mode=ui.mode; ui.netErr=''; save(); render(); if(ui.mode==='online') warmUp(); break;
    case 'start': startGame(); break;
    case 'roll': if(myTurn) doRoll(); break;
    case 'pick': if(myTurn&&T().choice==null) doPick(+b.dataset.f); break;
    case 'stop': if(myTurn) doStop(); break;
    case 'next': if(myTurn) advance(); break;
    case 'fast': pref.fast=!pref.fast; save(); render(); schedule(); break;
    case 'sound': pref.sound=!soundOn(); save(); render(); if(soundOn()) playSetAside(2); break;
    case 'ask-new': ui.confirm='new'; render(); break;
    case 'ask-leave': ui.confirm='leave'; render(); break;
    case 'cancel-new': ui.confirm=false; render(); break;
    case 'new': clearTimeout(aiTimer); ui.confirm=false; S=null; ui.mode='local'; save(); render(); break;
    case 'again': startGame(); break;
    case 'create': createOnline(); break;
    case 'join': joinOnline(); break;
    case 'reconnect': if(pref.online&&pref.online.code) enterOnline(pref.online.code); break;
    case 'share': shareInvite(); break;
    case 'add-ai': addComputer(); break;
    case 'del-seat': removeSeat(b.dataset.id); break;
    case 'start-online': startOnline(); break;
    case 'again-online': againOnline(); break;
    case 'leave': ui.confirm=false; leaveOnline(); break;
    case 'takeover': takeOver(+b.dataset.i); break;
    case 'reclaim': reclaim(); break;
    case 'update': if(ui.update){ clearTimeout(aiTimer); save(); const go=ui.update; ui.update=null; renderUpdate(true); go(); } break;
  }
});
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('button')) pressing=Date.now(); },{capture:true,passive:true});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{
  if(!pressing) return; pressing=0;
  if(renderLater){ renderLater=false; setTimeout(render,60); }
},{capture:true,passive:true}));
document.addEventListener('input',e=>{
  const el=e.target, ds=el.dataset||{};
  if(ds.seat!=null){
    seats[+ds.seat].name=el.value; save();
    const av=el.parentElement.querySelector('.avatar');
    if(av) av.textContent=(el.value.trim().charAt(0)||'?').toUpperCase();
  } else if(ds.pref==='name'){ pref.name=el.value; save(); }
  else if(ds.ui==='joinCode'){
    const v=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
    if(v!==el.value) el.value=v;
    ui.joinCode=v;
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target&&e.target.id==='on-code'){ e.preventDefault(); joinOnline(); } });
function hover(f){
  const r=document.getElementById('rolled'); if(!r||!r.classList.contains('can')) return;
  r.querySelectorAll('.die').forEach(d=>d.classList.toggle('hi',f!=null&&d.dataset.f===String(f)&&!d.disabled));
}
document.addEventListener('pointerover',e=>{const d=e.target.closest('#rolled .die');hover(d&&!d.disabled?d.dataset.f:null)});
document.addEventListener('focusin',e=>{const d=e.target.closest('#rolled .die');hover(d?d.dataset.f:null)});

function warmUp(){ if(netReady()) getNet().catch(()=>{}); }   // Firebase alvast laden en inloggen
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  if(ON) getNet().then(n=>n.kick&&n.kick()).catch(()=>{});
  else if(ui.mode==='online') warmUp();
});

/* ---------- opstart ---------- */
function boot(d){
  if(d&&d.S!==undefined){S=d.S;if(d.seats)seats=d.seats;if(d.pref)pref=d.pref;}
  else{
    const l=load();
    if(l){ if(Array.isArray(l.seats)&&l.seats.length===6) seats=l.seats; if(l.pref) pref=l.pref; if(l.S&&!l.S.over) S=l.S; }
  }
  if(S&&S.turn&&S.msg!==undefined) delete S.msg;
  ui.mode=pref.mode==='online'?'online':'local';
  const h=(location.hash||'').match(/^#([A-Za-z]{4})$/);
  if(h){ ui.mode='online'; ui.joinCode=h[1].toUpperCase(); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  if(!h&&pref.online&&pref.online.code&&netReady()) enterOnline(pref.online.code);
  else { render(); schedule(); if(ui.mode==='online') warmUp(); }
}
try{window.claude?.hot?.snapshot?.(()=>({S:ON?stashS:S,seats,pref}))}catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? null);
})();
</script>

<script>
/* App-schil: service worker registreren en melden wanneer er een nieuwe versie klaarstaat */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var wantReload=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(wantReload) location.reload(); });
  function offer(worker){
    if(!navigator.serviceWorker.controller || !window.__pwShowUpdate) return;
    window.__pwShowUpdate(function(){
      wantReload=true;
      worker.postMessage({type:'SKIP_WAITING'});
      setTimeout(function(){ location.reload(); },3000);
    });
  }
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if(reg.waiting) offer(reg.waiting);
      reg.addEventListener('updatefound',function(){
        var w=reg.installing; if(!w) return;
        w.addEventListener('statechange',function(){ if(w.state==='installed') offer(w); });
      });
      function check(){ reg.update().catch(function(){}); }
      document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
      setInterval(check,30*60*1000);
    }).catch(function(){});
  });
})();
</script>
